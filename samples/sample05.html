<!DOCTYPE html>
<html>
    <head>
        <title>My WebGPU sample</title>
        <script type="module">
            import { alertFail, initWebGpu } from "./sample01_init_webgpu/sample.js"
            import {
                genXorTexture,
                createTextureAndSamplerBindGroup,
                initSample05Verts,
                initSample05Pipeline, 
                renderSample05,
            } from
                "./sample05_textures/sample.js"

            const [device, context,] = await initWebGpu();

            const buf = initSample05Verts(device);
            const pipeline = initSample05Pipeline(device, context);
            const tex = genXorTexture(device, 256, 256);
            const samp = device.createSampler({
                addressModeU: "repeat",
                addressModeV: "repeat",
                magFilter: "nearest",
                minFilter: "nearest",
            });
            const bg = createTextureAndSamplerBindGroup(device, pipeline, tex, samp);
            renderSample05(device, context, pipeline, buf, bg);
        </script>
    </head>
    <body>
        <canvas width="800" height="600"></canvas>
    </body>
</html>
