<!DOCTYPE html>
<html>
    <head>
        <title>My WebGPU sample</title>
        <script type="module">
            import { alertFail, initWebGpu } from "./sample01_init_webgpu/sample.js"
            import {
                genXorTexture,
                createTextureAndSamplerBindGroup,
                initSample05Verts,
                initSample05Pipeline, 
                renderSample05,
                loadTexture,
                initSample05OffsetBg,
            } from
                "./sample05_textures/sample.js"

            const [device, context,] = await initWebGpu();

            const buf = initSample05Verts(device);
            const pipeline = initSample05Pipeline(device, context);
            //const tex = genXorTexture(device, 256, 256);
            
            const tex = await loadTexture(
                device, new URL("y2k_texture_pack_x30/128/y2k_stone.png", import.meta.url));
            
            const samp = device.createSampler({
                addressModeU: "repeat",
                addressModeV: "repeat",
                magFilter: "linear",
                minFilter: "linear",
            });
            const texBg = createTextureAndSamplerBindGroup(device, pipeline, tex, samp);
            const offBg = initSample05OffsetBg(device, pipeline, [0.2, -0.2]);
            renderSample05(device, context, pipeline, buf, texBg, offBg);
        </script>
    </head>
    <body>
        <canvas width="800" height="600"></canvas>
    </body>
</html>
