<!DOCTYPE html>
<html>
    <head>
        <title>My WebGPU sample</title>
        <script type="importmap">
            {
                "imports": {
                    "gl-matrix": "./node_modules/gl-matrix/esm/index.js",
                    "gl-matrix/": "./node_modules/gl-matrix/esm/"
                }
            }
        </script>

        <script type="module">
            import { alertFail, initWebGpu } from "./sample01_init_webgpu/sample.js"
            import { Sample09 } from
                "./sample09_nodes_and_cameras/sample.js"

            const [device, context] = await initWebGpu();

            const sample = new Sample09(device, context);

            sample.startRendering();

    <body>
        <canvas width="800" height="600"></canvas>

        <p>
        Controls (QWERTY):
            <ul>

                <li>D: strafe right</li>
                <li>Space: move up relative to facing</li>
                <li>C: move down relative to facing</li>
                <li>Arrows: rotate camera</li>
            </ul>
        </p>
