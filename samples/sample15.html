<!DOCTYPE html>
<html>
    <head>
        <title>Spheres and Cubemaps</title>
        <script type="importmap">
            {
                "imports": {
                    "gl-matrix": "./node_modules/gl-matrix/esm/index.js",
                    "gl-matrix/": "./node_modules/gl-matrix/esm/"
                }
            }
        </script>

        <script type="module">
            import { alertFail, initWebGpu } from "./sample01_init_webgpu/sample.js"
            import { Sample15, genCheckerboardTex, genMips, createMipmapPipeline } from
                "./sample15_adv_textures/sample.js"
            import { loadTexture, } from
                "./sample05_textures/sample.js"
            
            const [device, context] = await initWebGpu();

            const texDim = 32;
            const texLayers = Math.log2(32);
            const unmippedTex = genCheckerboardTex(device, texDim / 2, 1);
            const mipPipe = createMipmapPipeline(device);
            const mippedTex = genCheckerboardTex(device, texDim / 2, texLayers, mipPipe);
            genMips(device, await mippedTex, texLayers, mipPipe);

            const sample = new Sample15(
                device,
                context,
                await unmippedTex,
                await mippedTex,
            );

            sample.startUpdating();
            sample.startRendering();

        </script>
    </head>
    <body>
        <canvas width="800" height="600"></canvas>
    </body>
</html>
