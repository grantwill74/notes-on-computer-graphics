<!DOCTYPE html>
<html>
    <head>
        <title>Terrain</title>
        <script type="importmap">
            {
                "imports": {
                    "gl-matrix": "./node_modules/gl-matrix/esm/index.js",
                    "gl-matrix/": "./node_modules/gl-matrix/esm/"
                }
            }
        </script>

        <style>
            #AnisoText {
                width: 24px;
            }
        </style>

        <script type="module">
            import { alertFail, initWebGpu } from "./sample01_init_webgpu/sample.js";
            import { genMips, createMipmapPipeline } from
                "./sample15_adv_textures/sample.js";
            import { loadTexture, } from
                "./sample05_textures/sample.js";
            import { Sample16, ImageHeightmap } from "./sample16_landscape/sample.js";
            
            const [device, context] = await initWebGpu();

            const texDir = './y2k_texture_pack_x30/1024/'
            const textureUrls = {
                grass: new URL(texDir + 'y2k_grass.png', import.meta.url),
                sand: new URL(texDir + 'y2k_sand.png', import.meta.url),
                water: new URL(texDir + 'y2k_water.png', import.meta.url),
                snow: new URL(texDir + 'y2k_snow.png', import.meta.url),
                stone: new URL(texDir + 'y2k_stone.png', import.meta.url),
            }

            const mipPipe = createMipmapPipeline(device);

            
            const texturePromises = {}
            for (let [name, url] of Object.entries(textureUrls)) {
                texturePromises[name] = loadTexture(device, url, 'rgba8unorm-srgb', true)
                    .then((tex) => {
                        const mipLevels = Math.log2(Math.min(tex.width, tex.height));
                        genMips(device, tex, mipLevels, mipPipe);
                        return tex;
                    });
            }
            

            // const hmUrl = 'special_textures/world_heightmap.png'
            // const worldHm_req = await fetch(new URL(hmUrl, import.meta.url));
            // const worldHm_blob = await worldHm_req.blob();
            // const worldHm_bmp = await createImageBitmap(await worldHm_blob);
            // const tempCanv = new OffscreenCanvas(worldHm_bmp.width, worldHm_bmp.height);
            // const tempCon = tempCanv.getContext('2d');
            // tempCon.drawImage(worldHm_bmp, 0, 0);
            // const worldHm = tempCon.getImageData(0, 0, worldHm_bmp.width, worldHm_bmp.height);

            //const mipPipe = createMipmapPipeline(device);
            //genMips(device, worldHm, texLayers, mipPipe);

            const sample = new Sample16(
                device,
                context,
                await texturePromises.grass,
                await texturePromises.sand,
                await texturePromises.water,
                await texturePromises.snow,
                await texturePromises.stone,
                // worldHm
            );

            sample.startRendering();
            
        </script>
    </head>
    <body>
        <canvas width="800" height="600"></canvas>
        <p>
            <ul>
                <li>Use WASD to move</li>
                <li>Use arrows to rotate</li>
                <li>Space to float up</li>
                <li>C to float down</li>
            </ul>
        </p>
    </body>
</html>
